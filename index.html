<!DOCTYPE html>
<html lang="en" data-theme="dark" data-theme-color="1">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <title>JARVIS | Enterprise AI Assistant</title>
    <style>
        /* Same professional CSS as before – include your full CSS here for completeness */
        /* (To save space, I'll keep a minimal but functional style; you can copy your existing CSS) */
              /* ==================== CSS RESET & ROOT ==================== */
        :root {
            --color-1: #00ffff;
            --color-2: #ff00ff;
            --color-3: #ff6600;
            --color-4: #00ff66;
            --color-5: #ff0066;
            --color-6: #6600ff;
            --color-7: #ffff00;
            --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
            --spring-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        [data-theme="dark"] {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111114;
            --bg-tertiary: #1a1a20;
            --bg-quaternary: #22222a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0c0;
            --text-muted: #6b6b8d;
            --accent-secondary: #0088ff;
            --accent-glow: rgba(0, 255, 255, 0.15);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            --message-user-bg: linear-gradient(135deg, rgba(0, 255, 255, 0.12), rgba(0, 136, 255, 0.08));
            --message-bot-bg: rgba(255, 255, 255, 0.03);
            --sidebar-bg: rgba(17, 17, 20, 0.95);
            --header-bg: rgba(10, 10, 15, 0.85);
            --input-bg: rgba(30, 30, 50, 0.6);
            --hover-bg: rgba(255, 255, 255, 0.06);
            --card-bg: rgba(17, 17, 20, 0.98);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.06);
            --gradient-1: linear-gradient(135deg, #00ffff, #0088ff);
            --gradient-2: linear-gradient(135deg, #ff00ff, #6600ff);
            --gradient-3: linear-gradient(135deg, #ff6600, #ff0066);
        }

        [data-theme="light"] {
            --bg-primary: #f5f6fa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #eef0f5;
            --bg-quaternary: #e4e7ed;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --text-muted: #8a8aaa;
            --accent-secondary: #0055cc;
            --accent-glow: rgba(0, 102, 204, 0.15);
            --border-color: rgba(0, 0, 0, 0.08);
            --border-hover: rgba(0, 0, 0, 0.15);
            --message-user-bg: linear-gradient(135deg, rgba(0, 102, 204, 0.08), rgba(0, 68, 153, 0.05));
            --message-bot-bg: rgba(0, 0, 0, 0.02);
            --sidebar-bg: rgba(255, 255, 255, 0.95);
            --header-bg: rgba(255, 255, 255, 0.85);
            --input-bg: rgba(240, 242, 245, 0.8);
            --hover-bg: rgba(0, 0, 0, 0.04);
            --card-bg: #ffffff;
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --glass-bg: rgba(0, 0, 0, 0.02);
            --glass-border: rgba(0, 0, 0, 0.06);
            --gradient-1: linear-gradient(135deg, #0066cc, #004499);
            --gradient-2: linear-gradient(135deg, #cc00cc, #4400cc);
            --gradient-3: linear-gradient(135deg, #cc4400, #cc0055);
        }

        [data-theme-color="1"] { --accent-primary: var(--color-1); }
        [data-theme-color="2"] { --accent-primary: var(--color-2); }
        [data-theme-color="3"] { --accent-primary: var(--color-3); }
        [data-theme-color="4"] { --accent-primary: var(--color-4); }
        [data-theme-color="5"] { --accent-primary: var(--color-5); }
        [data-theme-color="6"] { --accent-primary: var(--color-6); }
        [data-theme-color="7"] { --accent-primary: var(--color-7); }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Inter', system-ui, sans-serif;
            color: var(--text-primary);
            transition: background 0.5s var(--transition-smooth), color 0.5s var(--transition-smooth);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ==================== SCROLLBAR ==================== */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: var(--accent-primary); border-radius: 10px; opacity: 0.5; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-secondary); }
        
        * { scrollbar-width: thin; scrollbar-color: var(--accent-primary) transparent; }

        /* ==================== PARTICLES BACKGROUND ==================== */
        #particles-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.4;
        }

        /* ==================== LOGIN SCREEN ==================== */
        .login-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-primary);
            z-index: 10000;
            backdrop-filter: blur(30px);
            transition: opacity 0.5s var(--transition-smooth);
        }

        .login-container.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .login-card {
            background: var(--card-bg);
            padding: 56px 48px;
            border-radius: 36px;
            text-align: center;
            border: 1px solid var(--glass-border);
            box-shadow: var(--card-shadow), 0 0 60px var(--accent-glow);
            max-width: 460px;
            width: 92%;
            position: relative;
            overflow: hidden;
            animation: cardAppear 0.8s var(--spring-bounce);
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at center, var(--accent-glow) 0%, transparent 70%);
            animation: rotateGlow 8s linear infinite;
            opacity: 0.5;
            pointer-events: none;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        @keyframes rotateGlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .login-card h1 {
            font-size: 64px;
            font-weight: 800;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -2px;
            position: relative;
            z-index: 1;
        }

        .login-card .subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 40px;
            position: relative;
            z-index: 1;
            font-weight: 500;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            width: 100%;
            padding: 16px 24px;
            background: #ffffff;
            color: #1a1a2e;
            border: 2px solid #e0e0e0;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s var(--transition-smooth);
            position: relative;
            z-index: 1;
            letter-spacing: 0.3px;
        }

        .google-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            border-color: #4285f4;
        }

        .google-btn:active {
            transform: translateY(-1px);
        }

        .google-btn img {
            width: 22px;
            height: 22px;
        }

        .login-footer {
            margin-top: 28px;
            font-size: 12px;
            color: var(--text-muted);
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            position: relative;
            z-index: 1;
            line-height: 1.8;
        }

        /* ==================== MAIN APP ==================== */
        .app-container {
            display: none;
            height: 100vh;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .app-container.visible {
            display: flex;
        }

        /* ==================== HEADER ==================== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 28px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(30px) saturate(180%);
            flex-shrink: 0;
            z-index: 100;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-toggle {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 22px;
            cursor: pointer;
            padding: 10px;
            border-radius: 14px;
            transition: all 0.3s var(--transition-smooth);
            display: none;
        }

        .menu-toggle:hover {
            background: var(--hover-bg);
            color: var(--accent-primary);
            transform: scale(1.05);
        }

        .logo-section h1 {
            font-size: 26px;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            cursor: default;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 10px;
            border-radius: 14px;
            transition: all 0.3s var(--transition-smooth);
            position: relative;
        }

        .icon-btn:hover {
            background: var(--hover-bg);
            color: var(--accent-primary);
            transform: translateY(-2px);
        }

        .icon-btn .tooltip {
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-quaternary);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 11px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .icon-btn:hover .tooltip {
            opacity: 1;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px 8px 10px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s var(--transition-smooth);
        }

        .user-profile:hover {
            background: var(--hover-bg);
            border-color: var(--border-hover);
            transform: translateY(-2px);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--gradient-1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #ffffff;
            font-size: 15px;
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .user-name {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 600;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ==================== MAIN LAYOUT ==================== */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* ==================== SIDEBAR ==================== */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 150;
            opacity: 0;
            transition: opacity 0.3s var(--transition-smooth);
            pointer-events: none;
        }

        .sidebar-overlay.active {
            display: block;
            opacity: 1;
            pointer-events: all;
        }

        .sidebar {
            width: 300px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            transition: transform 0.4s var(--spring-bounce);
            overflow: hidden;
            flex-shrink: 0;
            backdrop-filter: blur(30px) saturate(180%);
            z-index: 200;
        }

        .new-chat-btn {
            width: 100%;
            padding: 14px 20px;
            background: var(--gradient-1);
            border: none;
            border-radius: 50px;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 24px;
            transition: all 0.3s var(--transition-smooth);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 15px;
        }

        .new-chat-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 255, 255, 0.4);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            margin: 0 -8px;
            padding: 0 8px;
        }

        .history-group {
            margin-bottom: 24px;
        }

        .group-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 10px;
            padding-left: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .chat-item {
            padding: 12px 14px;
            margin: 2px 0;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 13px;
            transition: all 0.3s var(--transition-smooth);
            position: relative;
        }

        .chat-item::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            width: 3px;
            height: 100%;
            background: var(--accent-primary);
            transform: scaleY(0);
            transition: transform 0.3s var(--transition-smooth);
        }

        .chat-item:hover {
            background: var(--hover-bg);
            transform: translateX(2px);
        }

        .chat-item:hover::before {
            transform: scaleY(1);
        }

        .chat-item.active {
            background: var(--message-user-bg);
            color: var(--accent-primary);
            font-weight: 600;
        }

        .chat-item.active::before {
            transform: scaleY(1);
        }

        .chat-item .chat-title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-item .chat-delete {
            opacity: 0;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 14px;
        }

        .chat-item:hover .chat-delete {
            opacity: 1;
        }

        .chat-item .chat-delete:hover {
            color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
        }

        .sidebar-footer {
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            gap: 8px;
        }

        /* ==================== CHAT AREA ==================== */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            overflow: hidden;
            position: relative;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 28px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 72%;
            margin-bottom: 24px;
            animation: messageSlideIn 0.4s var(--spring-bounce);
        }

        @keyframes messageSlideIn {
            from { opacity: 0; transform: translateY(15px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .user-message { margin-left: auto; }
        .bot-message { margin-right: auto; }
        .system-message { 
            margin: 20px auto; 
            text-align: center; 
            max-width: 65%;
        }

        .message-content {
            padding: 14px 20px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.7;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-message .message-content {
            background: var(--message-user-bg);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-bottom-right-radius: 6px;
        }

        .bot-message .message-content {
            background: var(--message-bot-bg);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 6px;
        }

        .system-message .message-content {
            background: linear-gradient(135deg, rgba(255, 193, 7, 0.08), rgba(255, 152, 0, 0.05));
            border: 1px solid rgba(255, 193, 7, 0.2);
            color: #ffc107;
            font-size: 13px;
            padding: 10px 18px;
            border-radius: 16px;
        }

        .message-meta {
            display: flex;
            gap: 10px;
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-muted);
            padding: 0 4px;
        }

        .user-message .message-meta { justify-content: flex-end; }

        /* ==================== TYPING INDICATOR ==================== */
        .typing-indicator {
            display: flex;
            gap: 6px;
            padding: 14px 20px;
            background: var(--message-bot-bg);
            border-radius: 20px;
            width: fit-content;
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 6px;
            align-items: center;
        }

        .typing-indicator .dot {
            width: 9px;
            height: 9px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }

        .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        /* ==================== INPUT AREA ==================== */
        .input-area {
            padding: 18px 28px 24px;
            background: var(--header-bg);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
            backdrop-filter: blur(30px) saturate(180%);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            background: var(--input-bg);
            border-radius: 60px;
            padding: 8px 8px 8px 24px;
            border: 2px solid var(--glass-border);
            transition: all 0.3s var(--transition-smooth);
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-primary);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        #input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 14px 0;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            font-family: inherit;
        }

        #input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        #input:disabled {
            opacity: 0.5;
        }

        .input-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-action-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            transition: all 0.3s var(--transition-smooth);
        }

        .input-action-btn:hover {
            color: var(--accent-primary);
            background: var(--hover-bg);
            transform: scale(1.1);
        }

        .input-action-btn.recording {
            color: #ff4444;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        #sendBtn {
            background: var(--gradient-1);
            border: none;
            border-radius: 50px;
            padding: 12px 28px;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s var(--transition-smooth);
            font-size: 14px;
        }

        #sendBtn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 255, 255, 0.4);
        }

        #sendBtn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ==================== MODAL ==================== */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 36px;
            max-width: 560px;
            width: 92%;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
            box-shadow: var(--card-shadow);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .modal-header h3 {
            font-size: 28px;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .close-modal {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            font-size: 20px;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .close-modal:hover {
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
            border-color: #ff4444;
            transform: rotate(90deg);
        }

        .setting-section {
            margin-bottom: 28px;
        }

        .setting-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 16px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .theme-buttons, .color-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .theme-btn, .color-btn {
            flex: 1;
            min-width: 80px;
            padding: 12px 16px;
            border: 2px solid var(--glass-border);
            border-radius: 40px;
            background: var(--glass-bg);
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.3s var(--transition-smooth);
            text-align: center;
            font-weight: 600;
            font-size: 13px;
        }

        .theme-btn:hover, .color-btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent-primary);
        }

        .theme-btn.active, .color-btn.active {
            background: var(--gradient-1);
            color: #ffffff;
            border-color: transparent;
        }

        .color-btn {
            width: 48px;
            height: 48px;
            min-width: 48px;
            border-radius: 50%;
            padding: 0;
            flex: 0 0 48px;
            position: relative;
        }

        .color-btn.active::after {
            content: '✓';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            font-weight: 700;
        }

        .color-btn[data-color="1"] { background: #00ffff; }
        .color-btn[data-color="2"] { background: #ff00ff; }
        .color-btn[data-color="3"] { background: #ff6600; }
        .color-btn[data-color="4"] { background: #00ff66; }
        .color-btn[data-color="5"] { background: #ff0066; }
        .color-btn[data-color="6"] { background: #6600ff; }
        .color-btn[data-color="7"] { background: #ffff00; }

        select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            background: var(--input-bg);
            border: 2px solid var(--glass-border);
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
        }

        select:hover, select:focus {
            border-color: var(--accent-primary);
            outline: none;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--glass-bg);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--gradient-1);
            cursor: pointer;
        }

        .sidebar-button {
            padding: 14px 20px;
            border-radius: 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
            width: 100%;
        }

        .sidebar-button:hover {
            background: var(--hover-bg);
            border-color: var(--accent-primary);
            transform: translateY(-2px);
        }

        .danger-btn {
            background: rgba(255, 68, 68, 0.08);
            border: 1px solid rgba(255, 68, 68, 0.2);
            color: #ff6b6b;
        }

        .danger-btn:hover {
            background: rgba(255, 68, 68, 0.15);
            border-color: #ff6b6b;
        }

        .stats-box {
            background: var(--glass-bg);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid var(--glass-border);
        }

        .stats-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .stats-item:last-child {
            border-bottom: none;
        }

        .stats-label {
            color: var(--text-muted);
            font-size: 13px;
        }

        .stats-value {
            color: var(--accent-primary);
            font-weight: 700;
            font-size: 13px;
        }

        /* ==================== NOTIFICATION TOAST ==================== */
        .notification-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 100000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }

        .notification-toast {
            background: var(--card-bg);
            border: 1px solid var(--accent-primary);
            border-radius: 20px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            animation: slideInRight 0.5s var(--spring-bounce);
            pointer-events: all;
            min-width: 300px;
        }

        .notification-toast.removing {
            animation: slideOutRight 0.3s ease forwards;
        }

        @keyframes slideInRight {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOutRight {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(120%); opacity: 0; }
        }

        .toast-success { border-color: #00ff66; }
        .toast-error { border-color: #ff4444; }
        .toast-warning { border-color: #ffc107; }

        /* ==================== VOICE WAVE ==================== */
        .voice-wave {
            display: none;
            align-items: center;
            gap: 3px;
            height: 24px;
        }

        .voice-wave.active { display: flex; }

        .voice-wave .bar {
            width: 3px;
            height: 100%;
            background: var(--accent-primary);
            border-radius: 2px;
            animation: wave 0.8s ease infinite;
        }

        @keyframes wave {
            0%, 100% { transform: scaleY(0.5); opacity: 0.5; }
            50% { transform: scaleY(1); opacity: 1; }
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            .sidebar {
                position: fixed;
                left: 0; top: 0; bottom: 0;
                transform: translateX(-100%);
                width: 300px;
                border-radius: 0 24px 24px 0;
            }
            .sidebar.open { transform: translateX(0); }
            .message { max-width: 90%; }
            .user-name { display: none; }
            .header { padding: 12px 16px; }
            .chat-messages { padding: 16px 12px; }
            .input-area { padding: 12px 16px 16px; }
            .login-card { padding: 40px 28px; }
            .login-card h1 { font-size: 48px; }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas" style="position:fixed; inset:0; pointer-events:none; z-index:0;"></canvas>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-container">
        <div class="login-card">
            <h1 style="font-size: 48px; margin-bottom: 16px;">JARVIS</h1>
            <p style="margin-bottom: 32px;">Enterprise AI · Unlimited</p>
            <button class="google-btn" onclick="googleLogin()">
                <img src="https://www.google.com/favicon.ico" width="20"> Continue with Google
            </button>
            <div style="margin-top: 28px; font-size: 12px;">Built by Krish Paliwal | v3.1</div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app" class="app-container">
        <div class="header">
            <div><button class="icon-btn" onclick="toggleSidebar()">☰</button> <strong style="font-size: 22px;">JARVIS</strong></div>
            <div>
                <button class="icon-btn" onclick="toggleVoice()">🎤</button>
                <button class="icon-btn" onclick="openSettings()">⚙️</button>
                <div class="user-profile" style="display:inline-flex; align-items:center; gap:8px; margin-left:12px; cursor:pointer;" onclick="openSettings()">
                    <div id="userAvatar" style="width:32px; height:32px; border-radius:50%; background:var(--accent-primary); display:flex; align-items:center; justify-content:center;">U</div>
                    <span id="userName">User</span>
                </div>
                <button class="icon-btn" onclick="logout()">🚪</button>
            </div>
        </div>
        <div class="main-layout" style="display:flex; flex:1; overflow:hidden;">
            <div class="sidebar" id="sidebar">
                <button class="new-chat-btn" onclick="createNewChat()">＋ New Conversation</button>
                <div id="chatHistoryList">Loading...</div>
            </div>
            <div class="chat-area">
                <div class="chat-messages" id="chatMessages">
                    <div class="message system-message"><div class="message-content">✨ Welcome to JARVIS. Sign in to start.</div></div>
                </div>
                <div class="input-area">
                    <div class="input-wrapper">
                        <input type="text" id="input" placeholder="Ask JARVIS..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){sendMessage();event.preventDefault();}" disabled>
                        <button onclick="sendMessage()" id="sendBtn" disabled>Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <h3>Settings</h3>
            <div class="setting-section"><label>Theme</label><br>
                <button onclick="setTheme('dark')">Dark</button> <button onclick="setTheme('light')">Light</button> <button onclick="setTheme('system')">Auto</button>
            </div>
            <div class="setting-section"><label>AI Model</label><br>
                <select id="modelSelect"><option value="deepseek">⚡ JARVIS Technical</option><option value="groq">🚀 JARVIS Lightning</option><option value="gemini">🧘 JARVIS Philosopher</option></select>
            </div>
            <div class="setting-section"><label>Voice Language</label><br>
                <select id="voiceSelect"><option value="en-US">English (US)</option><option value="hi-IN">हिंदी</option></select>
            </div>
            <button onclick="exportChats()">Export Chats</button>
            <button class="danger-btn" onclick="clearAllHistory()" style="margin-top:12px; background:#ff4444; color:white;">Delete All History</button>
            <button onclick="closeSettings()" style="margin-top:16px;">Close</button>
        </div>
    </div>

    <div id="toastContainer" style="position:fixed; top:20px; right:20px; z-index:10002;"></div>

    <script>
        // ======================= GLOBALS =======================
        let currentSessionId = null;
        let isProcessing = false;
        let currentUser = null;
        let allSessions = [];
        let recognition = null;
        let isListening = false;
        
        // ======================= HELPERS =======================
        function showToast(msg, type="info") {
            const container = document.getElementById("toastContainer");
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        function getAuthHeaders() {
            const headers = { "Content-Type": "application/json" };
            const token = localStorage.getItem("jwt_token");
            if (token) headers["Authorization"] = `Bearer ${token}`;
            return headers;
        }
        
        async function apiCall(url, options = {}) {
            const res = await fetch(url, {
                ...options,
                credentials: "include",
                headers: { ...getAuthHeaders(), ...(options.headers || {}) }
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
            return data;
        }
        
        // ======================= AUTH =======================
        function getTokenFromURL() {
            const params = new URLSearchParams(location.search);
            const token = params.get("token");
            if (token) {
                localStorage.setItem("jwt_token", token);
                history.replaceState(null, "", location.pathname);
                return token;
            }
            return null;
        }
        getTokenFromURL();
        
        async function checkLogin() {
            try {
                const data = await apiCall("/api/me");
                if (data.success && data.user) {
                    currentUser = data.user.name || data.user.email;
                    document.getElementById("userName").innerText = currentUser;
                    document.getElementById("userAvatar").innerText = currentUser.charAt(0).toUpperCase();
                    document.getElementById("loginScreen").classList.add("hidden");
                    document.getElementById("app").classList.add("visible");
                    document.getElementById("input").disabled = false;
                    document.getElementById("sendBtn").disabled = false;
                    await loadSessions();
                    if (!currentSessionId) await createNewChat();
                    showToast(`Welcome, ${currentUser}!`, "success");
                } else {
                    document.getElementById("loginScreen").classList.remove("hidden");
                    document.getElementById("app").classList.remove("visible");
                }
            } catch(e) {
                console.error(e);
                document.getElementById("loginScreen").classList.remove("hidden");
                document.getElementById("app").classList.remove("visible");
            }
        }
        
        function googleLogin() {
            window.location.href = "/login/google";
        }
        
        function logout() {
            localStorage.removeItem("jwt_token");
            window.location.href = "/logout";
        }
        
        // ======================= SESSIONS =======================
        async function loadSessions() {
            try {
                const data = await apiCall("/ai/sessions");
                allSessions = data.sessions || [];
                renderSidebar();
            } catch(e) { showToast("Failed to load chats", "error"); }
        }
        
        function renderSidebar() {
            const container = document.getElementById("chatHistoryList");
            if (!allSessions.length) { container.innerHTML = "<div style='padding:20px;text-align:center;'>No chats yet</div>"; return; }
            let html = "";
            const groups = { Today: [], Yesterday: [], Older: [] };
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today - 86400000);
            allSessions.forEach(s => {
                const d = new Date(s.updated_at);
                if (d >= today) groups.Today.push(s);
                else if (d >= yesterday) groups.Yesterday.push(s);
                else groups.Older.push(s);
            });
            for (let [title, items] of Object.entries(groups)) {
                if (!items.length) continue;
                html += `<div class="history-group"><div class="group-title">${title}</div>`;
                items.forEach(s => {
                    html += `<div class="chat-item ${currentSessionId === s.id ? "active" : ""}" onclick="loadChat('${s.id}')">
                                <span class="chat-title">${escapeHtml(s.title)}</span>
                                <button class="chat-delete" onclick="event.stopPropagation(); deleteSession('${s.id}')">🗑️</button>
                            </div>`;
                });
                html += `</div>`;
            }
            container.innerHTML = html;
        }
        
        async function loadChat(sessionId) {
            if (currentSessionId === sessionId || isProcessing) return;
            currentSessionId = sessionId;
            document.getElementById("chatMessages").innerHTML = "";
            try {
                const data = await apiCall(`/ai/session/${sessionId}`);
                if (data.messages && data.messages.length) {
                    data.messages.forEach(m => addMessageToUI(m.content, m.role, m.model_used));
                } else {
                    addSystemMessage("✨ New conversation. How can I help?");
                }
                renderSidebar();
                scrollToBottom();
            } catch(e) { addSystemMessage("Failed to load messages."); }
            if (window.innerWidth <= 768) toggleSidebar();
        }
        
        async function createNewChat() {
            try {
                const data = await apiCall("/ai/session", { method: "POST", body: JSON.stringify({ title: "New Chat" }) });
                currentSessionId = data.session_id;
                document.getElementById("chatMessages").innerHTML = "";
                addSystemMessage("✨ New conversation started.");
                await loadSessions();
                if (window.innerWidth <= 768) toggleSidebar();
            } catch(e) { showToast("Failed to create chat", "error"); }
        }
        
        async function deleteSession(sessionId) {
            if (!confirm("Delete this conversation?")) return;
            try {
                await apiCall(`/ai/session/${sessionId}`, { method: "DELETE" });
                if (currentSessionId === sessionId) {
                    currentSessionId = null;
                    document.getElementById("chatMessages").innerHTML = "";
                }
                await loadSessions();
                if (!currentSessionId && allSessions.length) await loadChat(allSessions[0].id);
                else if (!currentSessionId) await createNewChat();
                showToast("Deleted", "success");
            } catch(e) { showToast("Delete failed", "error"); }
        }
        
        // ======================= MESSAGES =======================
        async function sendMessage() {
            if (isProcessing || !currentSessionId) return;
            const input = document.getElementById("input");
            const msg = input.value.trim();
            if (!msg) return;
            addMessageToUI(msg, "user");
            input.value = "";
            isProcessing = true;
            document.getElementById("sendBtn").disabled = true;
            showTypingIndicator();
            try {
                const model = document.getElementById("modelSelect").value;
                const data = await apiCall(`/ai/session/${currentSessionId}/message`, {
                    method: "POST",
                    body: JSON.stringify({ prompt: msg, model })
                });
                removeTypingIndicator();
                addMessageToUI(data.response, "assistant", data.model);
                if (data.is_first_message) await loadSessions();
            } catch(e) {
                removeTypingIndicator();
                addSystemMessage("Error: " + e.message);
            } finally {
                isProcessing = false;
                document.getElementById("sendBtn").disabled = false;
                input.focus();
            }
        }
        
        function addMessageToUI(text, role, modelUsed = null) {
            const container = document.getElementById("chatMessages");
            const div = document.createElement("div");
            div.className = `message ${role === "user" ? "user-message" : "bot-message"}`;
            let modelBadge = "";
            if (role === "assistant" && modelUsed) {
                const names = { deepseek: "JARVIS Technical", groq: "JARVIS Lightning", gemini: "JARVIS Philosopher" };
                modelBadge = `<span style="font-size:10px; opacity:0.7;"> via ${names[modelUsed] || "JARVIS"}</span>`;
            }
            div.innerHTML = `<div class="message-content">${escapeHtml(text).replace(/\n/g, "<br>")}</div>
                            <div class="message-meta"><span>${new Date().toLocaleTimeString()}</span>${modelBadge}</div>`;
            container.appendChild(div);
            scrollToBottom();
        }
        
        function addSystemMessage(text) {
            const container = document.getElementById("chatMessages");
            const div = document.createElement("div");
            div.className = "message system-message";
            div.innerHTML = `<div class="message-content">${escapeHtml(text)}</div>`;
            container.appendChild(div);
            scrollToBottom();
        }
        
        function showTypingIndicator() {
            const container = document.getElementById("chatMessages");
            const ind = document.createElement("div");
            ind.id = "typingIndicator";
            ind.className = "message bot-message";
            ind.innerHTML = `<div class="typing-indicator"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
            container.appendChild(ind);
            scrollToBottom();
        }
        function removeTypingIndicator() {
            const el = document.getElementById("typingIndicator");
            if (el) el.remove();
        }
        function scrollToBottom() {
            const container = document.getElementById("chatMessages");
            container.scrollTop = container.scrollHeight;
        }
        function escapeHtml(str) { return str.replace(/[&<>]/g, function(m) { if(m === "&") return "&amp;"; if(m === "<") return "&lt;"; if(m === ">") return "&gt;"; return m; }); }
        
        // ======================= VOICE =======================
        function toggleVoice() {
            if (!recognition) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) { showToast("Voice not supported", "error"); return; }
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = true;
                recognition.onresult = (e) => {
                    let text = "";
                    for (let i = e.resultIndex; i < e.results.length; i++) text += e.results[i][0].transcript;
                    document.getElementById("input").value = text;
                    if (e.results[0].isFinal) sendMessage();
                };
                recognition.onend = () => { isListening = false; updateVoiceUI(); };
                recognition.onerror = () => { isListening = false; updateVoiceUI(); };
            }
            if (isListening) { recognition.stop(); isListening = false; }
            else {
                recognition.lang = document.getElementById("voiceSelect").value;
                recognition.start();
                isListening = true;
            }
            updateVoiceUI();
        }
        function updateVoiceUI() {
            const btn = document.querySelector("[onclick='toggleVoice()']");
            if (isListening) btn.style.color = "#ff4444";
            else btn.style.color = "";
        }
        
        // ======================= DATA =======================
        async function exportChats() {
            try {
                const data = await apiCall("/ai/sessions");
                const exportData = [];
                for (const sess of data.sessions) {
                    const msgs = await apiCall(`/ai/session/${sess.id}`);
                    exportData.push({ session: sess, messages: msgs.messages });
                }
                const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `jarvis-export-${new Date().toISOString().slice(0,10)}.json`;
                a.click();
                URL.revokeObjectURL(url);
                showToast("Export complete", "success");
            } catch(e) { showToast("Export failed", "error"); }
        }
        
        async function clearAllHistory() {
            if (!confirm("⚠️ Delete ALL conversations? Cannot undo.")) return;
            try {
                const data = await apiCall("/ai/sessions");
                for (const sess of data.sessions) {
                    await apiCall(`/ai/session/${sess.id}`, { method: "DELETE" });
                }
                currentSessionId = null;
                document.getElementById("chatMessages").innerHTML = "";
                await loadSessions();
                await createNewChat();
                showToast("All history cleared", "success");
            } catch(e) { showToast("Clear failed", "error"); }
        }
        
        // ======================= UI =======================
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("open");
        }
        function openSettings() { document.getElementById("settingsModal").classList.add("active"); }
        function closeSettings() { document.getElementById("settingsModal").classList.remove("active"); }
        function setTheme(theme) {
            if (theme === "system") theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            document.documentElement.setAttribute("data-theme", theme);
            localStorage.setItem("theme", theme);
        }
        function loadTheme() { setTheme(localStorage.getItem("theme") || "dark"); }
        
        // ======================= INIT =======================
        window.onload = () => {
            loadTheme();
            checkLogin();
            window.onclick = (e) => { if (e.target === document.getElementById("settingsModal")) closeSettings(); };
            document.addEventListener("keydown", (e) => { if ((e.ctrlKey || e.metaKey) && e.key === "k") { e.preventDefault(); createNewChat(); } });
        };
    </script>
</body>
</html>
