<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>JARVIS - Advanced AI Assistant</title>
    <style>
        /* CSS Variables for Theming */
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111114;
            --bg-tertiary: #1a1a20;
            --text-primary: #ffffff;
            --text-secondary: #a0a0c0;
            --accent-primary: #00ffff;
            --accent-secondary: #0088ff;
            --border-color: rgba(255, 255, 255, 0.1);
            --message-user-bg: rgba(0, 255, 255, 0.15);
            --message-bot-bg: rgba(255, 255, 255, 0.05);
            --sidebar-bg: rgba(17, 17, 20, 0.95);
            --header-bg: rgba(17, 17, 20, 0.9);
            --input-bg: rgba(30, 30, 50, 0.9);
            --hover-bg: rgba(255, 255, 255, 0.05);
            --card-bg: rgba(17, 17, 20, 0.95);
        }

        /* Light Theme */
        [data-theme="light"] {
            --bg-primary: #f5f5f7;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e8e8ec;
            --text-primary: #1a1a2e;
            --text-secondary: #4a4a6a;
            --accent-primary: #0066cc;
            --accent-secondary: #004499;
            --border-color: rgba(0, 0, 0, 0.1);
            --message-user-bg: rgba(0, 102, 204, 0.1);
            --message-bot-bg: rgba(0, 0, 0, 0.03);
            --sidebar-bg: rgba(255, 255, 255, 0.95);
            --header-bg: rgba(255, 255, 255, 0.9);
            --input-bg: rgba(240, 240, 245, 0.9);
            --hover-bg: rgba(0, 0, 0, 0.03);
            --card-bg: #ffffff;
        }

        /* Dark Theme (Default) */
        [data-theme="dark"] {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111114;
            --bg-tertiary: #1a1a20;
            --text-primary: #ffffff;
            --text-secondary: #a0a0c0;
            --accent-primary: #00ffff;
            --accent-secondary: #0088ff;
            --border-color: rgba(255, 255, 255, 0.1);
            --message-user-bg: rgba(0, 255, 255, 0.15);
            --message-bot-bg: rgba(255, 255, 255, 0.05);
            --sidebar-bg: rgba(17, 17, 20, 0.95);
            --header-bg: rgba(17, 17, 20, 0.9);
            --input-bg: rgba(30, 30, 50, 0.9);
            --hover-bg: rgba(255, 255, 255, 0.05);
            --card-bg: #1a1a20;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg-primary);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Login Container */
        .login-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-primary);
            z-index: 9999;
        }

        .login-card {
            background: var(--card-bg);
            padding: 48px 40px;
            border-radius: 32px;
            text-align: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 90%;
        }

        .login-card h1 {
            color: var(--accent-primary);
            font-size: 48px;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .login-card p {
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 14px;
        }

        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 14px 20px;
            background: white;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
        }

        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .google-btn img {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .divider span {
            padding: 0 12px;
        }

        .info-text {
            margin-top: 24px;
            font-size: 12px;
            color: var(--text-secondary);
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        /* Main App Layout */
        .app-container {
            display: none;
            height: 100vh;
            flex-direction: column;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            flex-shrink: 0;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .menu-toggle {
            display: none;
            background: transparent;
            border: none;
            color: var(--accent-primary);
            font-size: 24px;
            cursor: pointer;
        }

        .logo-section h1 {
            color: var(--accent-primary);
            font-size: 22px;
        }

        .user-section {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .settings-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 8px 16px;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: 0.2s;
        }

        .settings-btn:hover {
            background: var(--hover-bg);
            border-color: var(--accent-primary);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--bg-primary);
            background-size: cover;
            background-position: center;
        }

        .user-name {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .logout-btn {
            background: rgba(255, 100, 100, 0.2);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }

        /* Main Layout */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            overflow-y: auto;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-primary);
            border: none;
            border-radius: 30px;
            color: var(--bg-primary);
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 20px;
            transition: 0.2s;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
        }

        .history-group {
            margin-bottom: 20px;
        }

        .group-title {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            padding-left: 8px;
        }

        .chat-item {
            padding: 10px 12px;
            margin: 4px 0;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 13px;
            transition: 0.2s;
        }

        .chat-item:hover {
            background: var(--hover-bg);
        }

        .chat-item.active {
            background: var(--message-user-bg);
            color: var(--accent-primary);
        }

        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            max-width: 80%;
            margin-bottom: 16px;
            animation: fadeIn 0.2s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            margin-left: auto;
        }

        .bot-message {
            margin-right: auto;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.5;
        }

        .user-message .message-content {
            background: var(--message-user-bg);
            border: 1px solid var(--accent-primary);
            border-bottom-right-radius: 4px;
        }

        .bot-message .message-content {
            background: var(--message-bot-bg);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }

        .system-message {
            margin: 10px auto;
            text-align: center;
            max-width: 80%;
        }

        .system-message .message-content {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid #ffc107;
            color: #ffc107;
            font-size: 12px;
        }

        .message-meta {
            display: flex;
            gap: 8px;
            margin-top: 6px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .user-message .message-meta {
            justify-content: flex-end;
        }

        /* Input Area */
        .input-area {
            padding: 16px 20px;
            background: var(--header-bg);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            background: var(--input-bg);
            border-radius: 30px;
            padding: 4px 4px 4px 20px;
            border: 1px solid var(--border-color);
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-primary);
        }

        #input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px 0;
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
        }

        #input::placeholder {
            color: var(--text-secondary);
        }

        #sendBtn {
            background: var(--accent-primary);
            border: none;
            border-radius: 30px;
            padding: 8px 24px;
            color: var(--bg-primary);
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 10px 14px;
            background: var(--message-bot-bg);
            border-radius: 18px;
            width: fit-content;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* Settings Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            border: 1px solid var(--border-color);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-header h3 {
            color: var(--accent-primary);
            font-size: 24px;
        }

        .close-modal {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
        }

        .setting-item {
            margin-bottom: 24px;
        }

        .setting-item label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 500;
        }

        .theme-select, .model-select {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 14px;
        }

        .stats-box {
            background: var(--bg-tertiary);
            border-radius: 16px;
            padding: 16px;
            margin-top: 8px;
        }

        .stats-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .stats-label {
            color: var(--text-secondary);
        }

        .stats-value {
            color: var(--accent-primary);
            font-weight: 500;
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            .menu-toggle {
                display: block;
            }
            
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 1000;
                transform: translateX(-100%);
                width: 280px;
            }
            
            .sidebar.open {
                transform: translateX(0);
            }
            
            .message {
                max-width: 90%;
            }
            
            .user-name {
                display: none;
            }
            
            .settings-btn span {
                display: none;
            }
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
        }
        
        .sidebar-overlay.open {
            display: block;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--border-color);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 3px;
        }
    </style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen" class="login-container">
    <div class="login-card">
        <h1>JARVIS</h1>
        <p>World's Largest Database AI</p>
        
        <button class="google-btn" onclick="googleLogin()">
            <img src="https://www.google.com/favicon.ico" alt="Google">
            Sign in with Google
        </button>
        
        <div class="info-text">
            Built by Krish Palival<br>
            Your data is stored securely
        </div>
    </div>
</div>

<!-- Main App -->
<div id="app" class="app-container">
    <div class="header">
        <div class="logo-section">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <h1>JARVIS</h1>
        </div>
        <div class="user-section">
            <button class="settings-btn" onclick="openSettings()">
                ⚙️ <span>Settings</span>
            </button>
            <div class="user-profile">
                <div class="user-avatar" id="userAvatar"></div>
                <span class="user-name" id="userName"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
    </div>

    <div class="main-layout">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
        
        <div class="sidebar" id="sidebar">
            <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
            <div class="chat-history" id="chatHistoryList"></div>
        </div>

        <div class="chat-area">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="input-area">
                <div class="input-wrapper">
                    <input type="text" id="input" placeholder="Ask JARVIS anything..." onkeypress="handleKeyPress(event)">
                    <button onclick="sendMessage()" id="sendBtn">Send</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Settings Modal -->
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>⚙️ Settings</h3>
            <button class="close-modal" onclick="closeSettings()">✕</button>
        </div>
        <div class="setting-item">
            <label>🎨 Theme</label>
            <select class="theme-select" id="themeSelect" onchange="changeTheme()">
                <option value="dark">🌙 Dark Mode</option>
                <option value="light">☀️ Light Mode</option>
                <option value="system">💻 System Default</option>
            </select>
        </div>
        <div class="setting-item">
            <label>🧠 AI Model</label>
            <select class="model-select" id="modelSelect">
                <option value="deepseek">DeepSeek (Default - Best for Technical)</option>
                <option value="groq">Groq (Fastest Responses)</option>
                <option value="gemini">Gemini (General Knowledge)</option>
            </select>
        </div>
        <div class="setting-item">
            <label>📊 Account Stats</label>
            <div class="stats-box" id="userStatsBox">
                <div class="stats-item">
                    <span class="stats-label">Username:</span>
                    <span class="stats-value" id="statUsername">-</span>
                </div>
                <div class="stats-item">
                    <span class="stats-label">Email:</span>
                    <span class="stats-value" id="statEmail">-</span>
                </div>
                <div class="stats-item">
                    <span class="stats-label">Logged in since:</span>
                    <span class="stats-value" id="statLoginTime">-</span>
                </div>
            </div>
        </div>
        <div class="setting-item">
            <label>ℹ️ About JARVIS</label>
            <div class="stats-box">
                <div class="stats-item">
                    <span class="stats-label">Version:</span>
                    <span class="stats-value">2.0.0</span>
                </div>
                <div class="stats-item">
                    <span class="stats-label">Creator:</span>
                    <span class="stats-value">Krish Palival</span>
                </div>
                <div class="stats-item">
                    <span class="stats-label">Default AI:</span>
                    <span class="stats-value">DeepSeek</span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// =========================
// GLOBAL VARIABLES
// =========================
let currentSessionId = null;
let isProcessing = false;
let currentUser = null;
let userEmail = null;

// =========================
// GOOGLE LOGIN
// =========================
function googleLogin() {
    window.location.href = '/login/google';
}

// =========================
// CHECK LOGIN STATUS
// =========================
async function checkLoginStatus() {
    try {
        let res = await fetch('/api/me');
        let data = await res.json();
        
        if (data.success) {
            currentUser = data.user.name;
            userEmail = data.user.email;
            
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            
            document.getElementById('userName').innerText = currentUser;
            const avatarDiv = document.getElementById('userAvatar');
            avatarDiv.innerText = currentUser.charAt(0).toUpperCase();
            if (data.user.avatar) {
                avatarDiv.style.backgroundImage = `url(${data.user.avatar})`;
                avatarDiv.style.backgroundSize = 'cover';
                avatarDiv.innerText = '';
            }
            
            // Update stats in settings
            document.getElementById('statUsername').innerText = currentUser;
            document.getElementById('statEmail').innerText = userEmail;
            document.getElementById('statLoginTime').innerText = new Date().toLocaleString();
            
            loadSessions();
            addSystemMessage(`Welcome, ${currentUser}! JARVIS is ready.`);
        } else {
            document.getElementById('loginScreen').style.display = 'flex';
            document.getElementById('app').style.display = 'none';
        }
    } catch (error) {
        console.error('Login check failed:', error);
    }
}

// =========================
// LOGOUT
// =========================
function logout() {
    window.location.href = '/logout';
}

// =========================
// THEME MANAGEMENT
// =========================
function changeTheme() {
    const theme = document.getElementById('themeSelect').value;
    
    if (theme === 'system') {
        const darkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', darkMode ? 'dark' : 'light');
    } else {
        document.documentElement.setAttribute('data-theme', theme);
    }
    
    localStorage.setItem('jarvis-theme', theme);
}

function loadTheme() {
    const savedTheme = localStorage.getItem('jarvis-theme') || 'dark';
    document.getElementById('themeSelect').value = savedTheme;
    changeTheme();
}

// =========================
// SIDEBAR TOGGLE
// =========================
function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    sidebar.classList.toggle('open');
    overlay.classList.toggle('open');
}

// =========================
// SETTINGS MODAL
// =========================
function openSettings() {
    document.getElementById('settingsModal').classList.add('active');
}

function closeSettings() {
    document.getElementById('settingsModal').classList.remove('active');
}

// =========================
// LOAD SESSIONS
// =========================
async function loadSessions() {
    try {
        let res = await fetch('/ai/sessions');
        let data = await res.json();
        
        if (data.success && data.sessions.length > 0) {
            renderSidebar(data.sessions);
            loadChat(data.sessions[0].id);
        } else {
            createNewChat();
        }
    } catch (error) {
        console.error('Failed to load sessions:', error);
    }
}

function renderSidebar(sessions) {
    const container = document.getElementById('chatHistoryList');
    container.innerHTML = '';
    
    const today = [];
    const yesterday = [];
    const older = [];
    
    const now = new Date();
    const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const yesterdayStart = new Date(todayStart);
    yesterdayStart.setDate(yesterdayStart.getDate() - 1);
    const weekStart = new Date(todayStart);
    weekStart.setDate(weekStart.getDate() - 7);
    
    sessions.forEach(session => {
        const sessionDate = new Date(session.updated_at);
        if (sessionDate >= todayStart) {
            today.push(session);
        } else if (sessionDate >= yesterdayStart) {
            yesterday.push(session);
        } else if (sessionDate >= weekStart) {
            older.push(session);
        } else {
            older.push(session);
        }
    });
    
    if (today.length > 0) addGroup(container, '📝 Today', today);
    if (yesterday.length > 0) addGroup(container, '📅 Yesterday', yesterday);
    if (older.length > 0) addGroup(container, '📁 Older', older);
}

function addGroup(container, title, sessions) {
    const groupDiv = document.createElement('div');
    groupDiv.className = 'history-group';
    
    const titleDiv = document.createElement('div');
    titleDiv.className = 'group-title';
    titleDiv.innerText = title;
    groupDiv.appendChild(titleDiv);
    
    sessions.forEach(session => {
        const item = document.createElement('div');
        item.className = `chat-item ${currentSessionId === session.id ? 'active' : ''}`;
        item.innerHTML = `<span>💬</span><span>${escapeHtml(session.title || 'New Chat')}</span>`;
        item.onclick = () => loadChat(session.id);
        groupDiv.appendChild(item);
    });
    
    container.appendChild(groupDiv);
}

// =========================
// LOAD CHAT
// =========================
async function loadChat(sessionId) {
    currentSessionId = sessionId;
    
    try {
        let res = await fetch(`/ai/session/${sessionId}`);
        let data = await res.json();
        
        if (data.success) {
            renderMessages(data.messages);
            loadSessions();
        }
    } catch (error) {
        console.error('Failed to load chat:', error);
    }
}

function renderMessages(messages) {
    const container = document.getElementById('chatMessages');
    container.innerHTML = '';
    
    messages.forEach(msg => {
        addMessageToUI(msg.content, msg.role === 'user' ? 'user' : 'bot');
    });
}

// =========================
// CREATE NEW CHAT
// =========================
async function createNewChat() {
    try {
        let res = await fetch('/ai/session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: 'New Chat' })
        });
        
        let data = await res.json();
        if (data.success) {
            currentSessionId = data.session_id;
            document.getElementById('chatMessages').innerHTML = '';
            addSystemMessage('New chat started');
            loadSessions();
            if (window.innerWidth <= 768) toggleSidebar();
        }
    } catch (error) {
        console.error('Failed to create chat:', error);
    }
}

// =========================
// SEND MESSAGE
// =========================
async function sendMessage() {
    if (isProcessing || !currentSessionId) return;
    
    const input = document.getElementById('input');
    const msg = input.value.trim();
    if (msg === '') return;
    
    addMessageToUI(msg, 'user');
    input.value = '';
    
    showTypingIndicator();
    isProcessing = true;
    document.getElementById('sendBtn').disabled = true;
    
    try {
        const selectedModel = document.getElementById('modelSelect').value;
        
        let res = await fetch(`/ai/session/${currentSessionId}/message`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: msg, model: selectedModel })
        });
        
        let data = await res.json();
        removeTypingIndicator();
        
        if (data.success) {
            addMessageToUI(data.response, 'bot');
            if (data.is_first_message) loadSessions();
        } else {
            addMessageToUI(data.error || 'Error', 'system');
        }
    } catch (error) {
        removeTypingIndicator();
        addMessageToUI('Connection error', 'system');
    } finally {
        isProcessing = false;
        document.getElementById('sendBtn').disabled = false;
    }
}

// =========================
// UI HELPERS
// =========================
function addMessageToUI(text, type) {
    const container = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = `message ${type}-message`;
    
    const content = document.createElement('div');
    content.className = 'message-content';
    content.innerText = text;
    
    const meta = document.createElement('div');
    meta.className = 'message-meta';
    const time = document.createElement('span');
    time.innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    meta.appendChild(time);
    
    div.appendChild(content);
    div.appendChild(meta);
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

function addSystemMessage(text) {
    addMessageToUI(text, 'system');
}

function showTypingIndicator() {
    const container = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'message bot-message';
    div.id = 'typingIndicator';
    
    const content = document.createElement('div');
    content.className = 'typing-indicator';
    for (let i = 0; i < 3; i++) {
        content.appendChild(document.createElement('span'));
    }
    
    div.appendChild(content);
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

function removeTypingIndicator() {
    const indicator = document.getElementById('typingIndicator');
    if (indicator) indicator.remove();
}

function handleKeyPress(event) {
    if (event.key === 'Enter') {
        event.preventDefault();
        sendMessage();
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// =========================
// INITIALIZE
// =========================
window.onload = function() {
    loadTheme();
    checkLoginStatus();
};

// Listen for system theme changes
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (document.getElementById('themeSelect').value === 'system') {
        changeTheme();
    }
});
</script>
